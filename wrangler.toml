name = "hvac-contact-v1"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "hvac.contact", custom_domain = true },
  { pattern = "www.hvac.contact", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
# Required so http/www/index.html redirects in the Worker run before static assets
# are served. Without this, matching assets short-circuit the Worker and the
# http/www/index.html variants return 200 with a canonical pointing at apex —
# GSC "Page with redirect".
run_worker_first = true
html_handling = "force-trailing-slash"
